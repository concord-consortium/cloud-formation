AWSTemplateFormatVersion: 2010-09-09
Description: "Researcher Dashboard runner: MicroVM image, roles, data bucket, token secret and log group"

Parameters:
  Environment:
    Type: String
    Description: Lowercase name of environment (either staging or production)
    Default: staging
    AllowedValues: [staging, production]
  Contact:
    Type: String
    Description: Value of the Contact cost-allocation tag
    Default: dmartin
  CodeArtifactBucket:
    Type: String
    Description: Bucket holding the runner code artifact zip (Dockerfile plus build context)
    Default: concord-devops
  CodeArtifactKey:
    Type: String
    Description: Key of the runner code artifact zip within CodeArtifactBucket
    Default: researcher-dashboard-runner/runner-0.1.0.zip
  BaseImageArn:
    Type: String
    Description: ARN of the Lambda-managed MicroVM base image
    Default: arn:aws:lambda:us-east-1:aws:microvm-image:al2023-1
  BaseImageVersion:
    Type: String
    Description: Version of the Lambda-managed base image. CloudFormation requires this, so base image patches need a stack update
    Default: "1"
  BaselineMemoryInMiB:
    Type: Number
    Description: Baseline MicroVM memory. 4096 gives 4 GB / 2 vCPU baseline, 16 GB / 8 vCPU peak and 16 GB of disk
    Default: 4096
    AllowedValues: [512, 1024, 2048, 4096, 8192]
  HooksPort:
    Type: Number
    Description: Port the runner's HTTP server listens on, for both the hooks listener and the runner's own PORT
    Default: 8080
    MinValue: 1
    MaxValue: 65535
  StatusBackend:
    Type: String
    Description: FIRESTORE writes the researcher status documents; LOG only logs them, for running a VM before the portal can mint a session token
    Default: FIRESTORE
    AllowedValues: [FIRESTORE, LOG]
  LogRetentionInDays:
    Type: Number
    Description: Days CloudWatch keeps the runner's build and runtime logs
    Default: 30

Resources:

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "researcher-dashboard-runner-${Environment}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        # Nothing here expires an object. Researchers re-analyze a class a year or
        # more after pulling it, so data is kept until something deletes it
        # deliberately. This rule only discards the orphaned parts of multipart
        # uploads that never completed, which are billed but unreadable.
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Contact
          Value: !Ref Contact
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: researcher-dashboard-runner

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-microvms/researcher-dashboard-runner-${Environment}"
      RetentionInDays: !Ref LogRetentionInDays
      Tags:
        - Key: Contact
          Value: !Ref Contact
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: researcher-dashboard-runner

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "researcher-dashboard-runner-${Environment}-build"
      Description: Assumed by Lambda to fetch the code artifact and write build logs while building the MicroVM image
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${CodeArtifactBucket}/${CodeArtifactKey}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"
      Tags:
        - Key: Contact
          Value: !Ref Contact
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: researcher-dashboard-runner

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "researcher-dashboard-runner-${Environment}-execution"
      Description: Runtime role of every MicroVM from this image. One role per image, not per researcher
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${DataBucket.Arn}/researchers/*"
              # Packages are published through report-service, never by a VM.
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/scripts/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"
              # The role is shared by every MicroVM from this image, so this
              # cannot be narrowed to the calling VM.
              - Effect: Allow
                Action: lambda:SuspendMicrovm
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm:*"
      Tags:
        - Key: Contact
          Value: !Ref Contact
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: researcher-dashboard-runner

  LauncherUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "researcher-dashboard-runner-${Environment}-launcher"
      Policies:
        - PolicyName: launch
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:RunMicrovm
                Resource:
                  - !GetAtt MicrovmImage.ImageArn
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm:*"
              # Read-only, and what the reuse decision is measured against: GetMicrovm
              # reports the version a VM runs, and relaunching unless that is current
              # needs the image's own version to compare it with.
              - Effect: Allow
                Action: lambda:GetMicrovmImage
                Resource: !GetAtt MicrovmImage.ImageArn
              # Both ARN shapes: these actions authorize against the image a VM was
              # built from as well as the VM itself, which is not visible from the API
              # surface and only showed up when a real call was refused on the image ARN.
              # One researcher's VM cannot be distinguished from another's in an ARN
              # either way, so this is image-wide, as SuspendMicrovm already is on the
              # execution role.
              - Effect: Allow
                Action:
                  - lambda:GetMicrovm
                  - lambda:CreateMicrovmAuthToken
                  - lambda:SuspendMicrovm
                  - lambda:TerminateMicrovm
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:microvm:*"
                  - !GetAtt MicrovmImage.ImageArn
              # run-microvm attaches the ingress and egress network connectors, and
              # passing an AWS-managed connector is its own permission, separate from
              # running the VM. The list is enumerated rather than wildcarded, so a
              # launcher that starts attaching a new connector needs this stack updated
              # too: SHELL_INGRESS is here because it yields an interactive root PTY, and
              # granting it by pattern would hand that out to any future connector name.
              - Effect: Allow
                Action: lambda:PassNetworkConnector
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:HTTP_INGRESS"
                  - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:SHELL_INGRESS"
                  - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
              # run-microvm hands the VM its execution role, which the caller must be
              # allowed to pass. Unconditioned: RunMicrovm does not populate
              # iam:PassedToService, so a condition on it never matches and the grant
              # never applies. The Resource is the one execution role, and that role's
              # trust policy admits only lambda.amazonaws.com, so passing it anywhere
              # else fails when the destination tries to assume it.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ExecutionRole.Arn
      Tags:
        - Key: Contact
          Value: !Ref Contact
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: researcher-dashboard-runner

  LauncherKey:
    Type: AWS::IAM::AccessKey
    DependsOn: LauncherUser
    Properties:
      UserName: !Sub "researcher-dashboard-runner-${Environment}-launcher"
      Serial: 1
      Status: Active

  MicrovmImage:
    Type: AWS::Lambda::MicrovmImage
    Properties:
      Name: !Sub "researcher-dashboard-runner-${Environment}"
      Description: !Sub "Researcher Dashboard analysis runner (${Environment})"
      BaseImageArn: !Ref BaseImageArn
      BaseImageVersion: !Ref BaseImageVersion
      BuildRoleArn: !GetAtt BuildRole.Arn
      CodeArtifact:
        Uri: !Sub "s3://${CodeArtifactBucket}/${CodeArtifactKey}"
      CpuConfigurations:
        - Architecture: ARM_64
      Resources:
        - MinimumMemoryInMiB: !Ref BaselineMemoryInMiB
      # Needed for CAP_SYS_ADMIN: the runner gives each analysis package its own
      # empty network namespace, without which the package can read execution-role
      # credentials from the instance metadata service.
      AdditionalOsCapabilities: ["ALL"]
      EgressNetworkConnectors:
        - !Sub "arn:aws:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:INTERNET_EGRESS"
      EnvironmentVariables:
        # Baked into the snapshot every VM shares, so nothing per-researcher and
        # nothing secret belongs here. Per-VM values arrive in runHookPayload.
        - Key: PORT
          Value: !Ref HooksPort
        - Key: DATA_ROOT
          Value: /data
        - Key: SYNC_BACKEND
          Value: S3
        - Key: STATUS_BACKEND
          Value: !Ref StatusBackend
      Hooks:
        Port: !Ref HooksPort
        MicrovmHooks:
          Run: ENABLED
          RunTimeoutInSeconds: 60
          Resume: ENABLED
          ResumeTimeoutInSeconds: 60
          Suspend: ENABLED
          SuspendTimeoutInSeconds: 60
          Terminate: ENABLED
          TerminateTimeoutInSeconds: 60
        MicrovmImageHooks:
          Ready: ENABLED
          ReadyTimeoutInSeconds: 600
          Validate: DISABLED
          ValidateTimeoutInSeconds: 600
      Logging:
        CloudWatch:
          LogGroup: !Ref LogGroup
      Tags:
        - Key: Contact
          Value: !Ref Contact
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: researcher-dashboard-runner

Outputs:
  DataBucketName:
    Description: Bucket holding researcher datasets and analysis packages
    Value: !Ref DataBucket
  MicrovmImageArn:
    Description: ARN of the MicroVM image, passed to run-microvm as --image-identifier
    Value: !GetAtt MicrovmImage.ImageArn
  ExecutionRoleArn:
    Description: ARN passed to run-microvm as --execution-role-arn
    Value: !GetAtt ExecutionRole.Arn
  BuildRoleArn:
    Description: ARN Lambda assumes to build the MicroVM image
    Value: !GetAtt BuildRole.Arn
  LauncherUserName:
    Description: IAM user the report-service launch function calls lambda-microvms as
    Value: !Ref LauncherUser
  LauncherUserArn:
    Description: ARN of the launch function's IAM user
    Value: !GetAtt LauncherUser.Arn
  LauncherAccessKey:
    Description: Access key of the launch function's user, set as AWS_KEY on the function
    Value: !Ref LauncherKey
  LauncherSecretKey:
    Description: Secret key of the launch function's user, set as AWS_SECRET_KEY on the function
    Value: !GetAtt [LauncherKey, SecretAccessKey]
  LogGroupName:
    Description: CloudWatch log group for MicroVM build and runtime logs
    Value: !Ref LogGroup
